[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidity-bot"
version = "0.1.0"
description = "Reward-aware, inventory-bounded liquidity provision for Polymarket US"
requires-python = ">=3.11"
dependencies = [
    "cryptography==50.0.0",
    "polymarket-us==0.1.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
